#
# Network telemetry configuration, read at BUILD time (not runtime) by
# gen_net_config.sh and compiled into constants -- see that script and
# ../SOFTWARE.md's telemetry section. KEY=VALUE, one per line; '#'
# comments and blank lines ignored.
#
# OUR_MAC: STM32F767ZI has no factory-burned/software-readable Ethernet
# MAC -- this is a locally-administered address (IEEE 802-2014 Sec.
# 8.2.2: second hex digit of octet 1 in {2,6,A,E}) chosen for
# development. Multiple boards sharing this default on one segment
# will collide -- change per board if more than one is ever on the
# same wire at once.
OUR_MAC=02:00:00:00:00:01
OUR_IP=192.168.10.100
OUR_PORT=5005

# DEST_IP/DEST_PORT: the unicast telemetry sink -- a non-routable
# address on the same network segment as the target board. Currently
# a direct point-to-point link: a USB-Ethernet dongle on the dev
# laptop, statically addressed 192.168.10.8 on this same /24 via
# Windows netsh/PowerShell, no gateway.
DEST_IP=192.168.10.8
DEST_PORT=6000
